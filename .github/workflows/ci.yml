name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Сборка и проверки
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Проверки и Android-сборка
        run: >
          ./gradlew ktlintCheck detekt
          :app:androidApp:lintDebug :app:androidApp:assembleDebug
          --stacktrace --console=plain

      - name: Сборка веб-таргета
        run: ./gradlew :app:webApp:jsBrowserDevelopmentWebpack --stacktrace --console=plain

      - name: Отчёты и APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/reports/detekt/**
            **/build/reports/ktlint/**
            app/androidApp/build/reports/**
            app/androidApp/build/outputs/apk/debug/*.apk
