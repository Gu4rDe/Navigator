org.gradle.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Compose Multiplatform 1.12 собран против Android API 37, а Platform 37 в публичном
# репозитории SDK недоступен (максимум — 36). Проект не вызывает API 26+ напрямую,
# проверка compileSdk для AAR-метаданных отключена до появления Platform 37.
android.experimental.disableCompileSdkChecks=true
